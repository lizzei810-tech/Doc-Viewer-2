plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hardwarefixer.docviewer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hardwarefixer.docviewer'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No extra libraries: the viewer is plain HTML/JS running in a WebView.
}
